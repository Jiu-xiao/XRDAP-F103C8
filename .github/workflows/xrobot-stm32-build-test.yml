name: xrobot stm32 build test

on:
  push:
    branches: ["main", "master", "refactor/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format 21.1.8, without the CubeMX code in Core/
        run: |
          pip install clang-format==21.1.8
          git ls-files 'User/*.hpp' 'User/*.cpp' 'User/*.h' 'test/*.cpp' | xargs clang-format --dry-run --Werror

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: build and run the host tests
        run: |
          cmake -S test -B build-test
          cmake --build build-test --parallel
          ctest --test-dir build-test --output-on-failure --no-tests=error

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-stm32:main
      options: --user 0
    env:
      GCC_TOOLCHAIN_ROOT: /opt/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: configure cmake
        run: |
          export PATH="${GCC_TOOLCHAIN_ROOT}:${PATH}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE:STRING=cmake/gcc-arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release

      - name: build
        run: |
          export PATH="${GCC_TOOLCHAIN_ROOT}:${PATH}"
          cmake --build build --parallel

      - name: package firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          OBJCOPY_BIN="${GCC_TOOLCHAIN_ROOT}/arm-none-eabi-objcopy"

          for MODE in 72m 96m; do
            FW_DIR="build/XRDAP_F103C8_clock_${MODE}"
            ELF_PATH="${FW_DIR}/XRDAP-F103C8.elf"
            MAP_PATH="${FW_DIR}/XRDAP_F103C8.map"
            FW_NAME="xrdap-f103c8-${MODE}"

            for FILE in "$ELF_PATH" "$MAP_PATH"; do
              if [ ! -f "$FILE" ]; then
                echo "Missing build output: $FILE"
                exit 1
              fi
            done

            cp "$ELF_PATH" "dist/${FW_NAME}.elf"
            cp "$MAP_PATH" "dist/${FW_NAME}.map"

            "$OBJCOPY_BIN" -O ihex "$ELF_PATH" "dist/${FW_NAME}.hex"
            "$OBJCOPY_BIN" -O binary "$ELF_PATH" "dist/${FW_NAME}.bin"
          done

      - name: upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            dist/*.elf
            dist/*.hex
            dist/*.bin
            dist/*.map
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist

      # Only the .bin and .hex of each clock are released; the .elf and .map stay in the
      # CI artifact.
      - name: collect the release files
        run: |
          mkdir release
          for MODE in 72m 96m; do
            cp "dist/xrdap-f103c8-${MODE}.bin" "dist/xrdap-f103c8-${MODE}.hex" release/
          done
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # A draft: the release text is added by hand before it is published.
      - name: create the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
